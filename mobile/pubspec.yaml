name: forge
description: "Forge — a Personal Operating System."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # Locale/date formatting
  intl: ^0.19.0

  # Local push notifications for habit reminders
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # Offline-first habit check-off: queue storage + reconnect detection
  shared_preferences: ^2.3.3
  connectivity_plus: ^6.1.0

  # Export/Import: write the backup file, share it out, and pick one back in
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  file_picker: ^10.3.9

  # Home-screen widgets: bridges today's streak/completion into native storage
  home_widget: ^0.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
