name: Backend CI

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/ci.yml"]
  pull_request:
    branches: [main]
    paths: ["backend/**", ".github/workflows/ci.yml"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: forge
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forge -d forge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build and test
        run: ./gradlew build --no-daemon
        env:
          DB_URL: jdbc:postgresql://localhost:5432/forge
          DB_USERNAME: forge
          DB_PASSWORD: forge
          JWT_SECRET: ci-only-secret-not-used-in-any-real-environment
