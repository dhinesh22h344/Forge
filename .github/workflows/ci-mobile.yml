name: Mobile CI

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/ci-mobile.yml"]
  pull_request:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/ci-mobile.yml"]

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
