spring:
  application:
    name: forge-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/forge}
    username: ${DB_USERNAME:forge}
    password: ${DB_PASSWORD:forge}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  # Render (and most free PaaS hosts) inject PORT rather than SERVER_PORT.
  port: ${PORT:${SERVER_PORT:8080}}

forge:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  jwt:
    # Local-dev-only default. MUST be overridden via the JWT_SECRET env var in any deployed
    # environment (see docker/docker-compose.yml and Milestone 12 deployment config).
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-please-32-bytes-min}
    access-token-ttl: 15m
    refresh-token-ttl: 30d

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
